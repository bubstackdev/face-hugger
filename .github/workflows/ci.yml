name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build tools and pinned Python
        run: |
          brew install xcodegen uv
          uv python install 3.12.14
          uv venv --python 3.12.14 .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version
      - name: Install locked upload dependencies
        run: |
          uv pip sync --python .venv/bin/python --require-hashes --only-binary=:all: Resources/runtime-requirements.txt
      - name: Test and build
        run: Scripts/check.sh --build
