name: FaceHugger
options:
  bundleIdPrefix: dev.zakkeown
  deploymentTarget:
    macOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '15.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
targets:
  FaceHugger:
    type: application
    platform: macOS
    sources:
      - path: Sources/FaceHugger
        excludes:
          - RuntimeBootstrap.swift
      - path: Sources/FaceHuggerCore
        excludes:
          - RuntimePolicy.swift
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PythonFnmatchLicense.txt
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zakkeown.FaceHugger
        PRODUCT_NAME: Face Hugger
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Resources/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_CFBundleDisplayName: Face Hugger
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
schemes:
  FaceHugger:
    build:
      targets:
        FaceHugger: all
